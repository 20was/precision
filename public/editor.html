<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Precision — Screenshot editor</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      html, body { width: 100%; min-width: 320px; height: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #f0f0ee; }
      @media (prefers-color-scheme: dark) { html, body { background: #1b1c1e; } }
      body > main { max-width: 560px; margin: 15vh auto; padding: 28px; font: 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      body > main h1 { font-size: 22px; }
      body > main p { color: #6f6f66; }
    </style>
  </head>
  <body>
    <script src="editor.js"></script>
  </body>
</html>
