<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Precision</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <main>
      <div class="identity">
        <svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
          <path class="center" d="M9 9h6v6H9z" />
        </svg>
        <h1>Precision</h1>
        <span class="version">0.1.2</span>
      </div>
      <h2>Element capture</h2>
      <p class="intro">Select an element on this page.</p>
      <button id="start" class="primary">
        <svg
          aria-hidden="true"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
          <rect x="9" y="9" width="6" height="6" /></svg
        >Start selecting
      </button>
      <div class="keys">
        <span>Click or <kbd>Enter</kbd> to capture</span
        ><span><kbd>Esc</kbd> to cancel</span>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
