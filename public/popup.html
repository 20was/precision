<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Precision</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <main>
      <div class="identity">
        <svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
          <path class="center" d="M9 9h6v6H9z" />
        </svg>
        <h1>Precision</h1>
      <span class="version">0.1.6</span>
      </div>
      <h2>Capture</h2>
      <p class="intro">Choose what you want to capture.</p>
      <button data-mode="element" class="primary">
        <svg
          aria-hidden="true"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
          <rect x="9" y="9" width="6" height="6" /></svg
        >Start selecting
      </button>
      <button data-mode="region" class="secondary">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 8V4h4m8 0h4v4M20 16v4h-4M8 20H4v-4" />
          <path d="M8 8h8v8H8z" />
        </svg>
        Select an area
      </button>
      <button data-mode="visible" class="secondary">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M8 8h8M8 12h8M8 16h4" />
        </svg>
        Capture visible area
      </button>
      <button data-mode="fullPage" class="secondary">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M5 4v16m0-16 3 3M5 4 2 7m17 13V4m0 16-3-3m3 3 3-3" />
        </svg>
        Capture full page
      </button>
      <button data-mode="compose" class="secondary">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="13" height="13" rx="2" />
          <path d="M8 20h11a2 2 0 0 0 2-2V7M7 8h5m-2.5-2.5v5" />
        </svg>
        Compose elements
      </button>
      <div class="keys">
        <span>Capture visible pixels</span><span><kbd>Esc</kbd> to cancel</span>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
